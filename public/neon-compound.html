<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fable Compound</title>
<style>
  :root {
    --grass: #79b25f;
    --wood-d: #4a2f1a;
    --wood: #6b4527;
    --wood-l: #8a5f3a;
    --parch: #f3e3c2;
    --parch-l: #f9efd9;
    --ink: #3a2a18;
    --ink-soft: #6d573c;
    --gold: #eeb64a;
    --gold-d: #c98f2d;
    --blue: #4a78d0;
    --red: #d05348;
    --green-ok: #4e8f3c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --display: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #3c7239;
    color: var(--ink);
    font-family: var(--display);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .wooden {
    background: linear-gradient(#8a5f3a, #6b4527);
    border: 2px solid var(--wood-d);
    border-radius: 14px;
    box-shadow: inset 0 2px 0 rgba(255, 235, 200, 0.25), 0 3px 8px rgba(30, 20, 8, 0.4);
  }
  .hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(10px + env(safe-area-inset-left));
    padding: 8px 12px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    line-height: 1.7;
    color: var(--parch);
    pointer-events: none;
    z-index: 5;
    min-width: 148px;
  }
  .hud b { color: var(--gold); font-weight: 700; }
  .hud .cap { color: #cbb491; font-size: 11px; letter-spacing: 0.06em; }
  .coin {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffdf8e, var(--gold) 55%, var(--gold-d));
    border: 1px solid #8a5a16;
    margin-right: 2px;
    vertical-align: -1px;
  }
  #eventRow { color: #cbb491; }
  #eventRow.live #eventName { color: var(--gold); font-weight: 700; }
  #banner {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 6;
    pointer-events: none;
    width: min(84vw, 460px);
  }
  .alert {
    background: var(--parch);
    border: 2px solid var(--wood);
    color: var(--ink);
    font-family: var(--display);
    font-weight: 700;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 999px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(30, 20, 8, 0.35);
    animation: alertIn 200ms ease-out;
    max-width: 100%;
  }
  .alert.good { border-color: var(--green-ok); color: #2f5d22; }
  .alert.event {
    background: none;
    border: none;
    box-shadow: none;
    font-size: clamp(20px, 5.5vw, 30px);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow:
      -2px -2px 0 #5a3a10, 2px -2px 0 #5a3a10,
      -2px 2px 0 #5a3a10, 2px 2px 0 #5a3a10,
      0 4px 10px rgba(30, 20, 8, 0.5);
  }
  @keyframes alertIn { from { opacity: 0; transform: translateY(-8px) scale(0.95); } }
  .alert.out { transition: opacity 400ms; opacity: 0; }

  .btn {
    position: fixed;
    z-index: 7;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(#8a5f3a, #6b4527);
    border: 3px solid var(--wood-d);
    box-shadow: inset 0 2px 0 rgba(255, 235, 200, 0.25), 0 3px 8px rgba(30, 20, 8, 0.45);
    color: var(--parch);
    font-family: var(--display);
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .btn:active { transform: scale(0.93); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #hitBtn {
    right: calc(18px + env(safe-area-inset-right));
    bottom: calc(98px + env(safe-area-inset-bottom));
    color: #ffd2b0;
    border-color: #7a3226;
    background: linear-gradient(#b46a4a, #8a4632);
  }
  #shopBtn {
    right: calc(102px + env(safe-area-inset-right));
    bottom: calc(24px + env(safe-area-inset-bottom));
    color: #3a2a18;
    border-color: #8a5a16;
    background: linear-gradient(#f4c35a, #d99a2e);
  }
  #stick {
    position: fixed;
    z-index: 6;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 2px solid rgba(74, 47, 26, 0.55);
    background: rgba(243, 227, 194, 0.22);
    display: none;
    pointer-events: none;
  }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(243, 227, 194, 0.75);
    border: 2px solid var(--wood);
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 5px rgba(30, 20, 8, 0.3);
  }

  #shop {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(340px, 92vw);
    background: linear-gradient(#8a5f3a, #6b4527);
    border-left: 3px solid var(--wood-d);
    box-shadow: -6px 0 18px rgba(30, 20, 8, 0.45);
    z-index: 10;
    transform: translateX(105%);
    transition: transform 220ms ease-out;
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
  }
  #shop.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    #shop { transition: none; }
    .alert { animation: none; }
  }
  #shopHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #shopHead h2 {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(30, 20, 8, 0.5);
  }
  #closeShop {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 2px solid var(--wood-d);
    background: var(--parch);
    color: var(--ink);
    font-size: 14px;
    font-weight: 800;
  }
  #shopMoney {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--parch);
    font-size: 14px;
    margin-bottom: 10px;
  }
  #shopMoney b { color: var(--gold); }
  #shopList { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .shopHeader {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.2em;
    color: #e6cfa4;
    margin-top: 6px;
    text-shadow: 0 1px 0 rgba(30, 20, 8, 0.5);
  }
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--parch);
    border: 2px solid var(--wood-d);
    border-radius: 12px;
    padding: 9px 10px;
    box-shadow: inset 0 1px 0 #fff8e8;
  }
  .swatch {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex: none;
    border: 2px solid rgba(58, 42, 24, 0.45);
  }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-size: 13px; font-weight: 800; color: var(--ink); }
  .card .sub { font-size: 11px; color: var(--ink-soft); font-family: var(--mono); }
  .buy {
    flex: none;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 800;
    padding: 8px 10px;
    border-radius: 10px;
    border: 2px solid #8a5a16;
    color: var(--ink);
    background: linear-gradient(#f4c35a, #d99a2e);
    box-shadow: 0 2px 0 #8a5a16;
  }
  .buy:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 1px 0 #8a5a16; }
  .buy:disabled {
    background: #d8c9a8;
    border-color: #a08d68;
    color: #8a7a5c;
    box-shadow: none;
    opacity: 0.9;
  }
  .buy.max { background: none; border-color: transparent; box-shadow: none; color: var(--green-ok); }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255, 245, 200, 0.2), transparent 60%),
      linear-gradient(#5a9e50, #3c7239 70%, #2f5c2d);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #introCard {
    background: var(--parch);
    border: 3px solid var(--wood-d);
    border-radius: 20px;
    box-shadow: 0 8px 28px rgba(20, 30, 12, 0.5), inset 0 2px 0 #fff8e8;
    padding: 30px 26px;
    max-width: 380px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #introCard h1 {
    font-size: clamp(30px, 8.5vw, 44px);
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 1.05;
    text-wrap: balance;
    color: var(--gold);
    text-shadow:
      -2px -2px 0 #5a3a10, 2px -2px 0 #5a3a10,
      -2px 2px 0 #5a3a10, 2px 2px 0 #5a3a10,
      0 4px 0 rgba(90, 58, 16, 0.4);
  }
  #introCard p {
    max-width: 32ch;
    color: var(--ink-soft);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.6;
  }
  #startBtn {
    margin-top: 4px;
    font-family: var(--display);
    font-weight: 900;
    letter-spacing: 0.1em;
    font-size: 17px;
    color: var(--ink);
    background: linear-gradient(#f4c35a, #d99a2e);
    border: 3px solid #8a5a16;
    border-radius: 14px;
    padding: 13px 40px;
    box-shadow: 0 4px 0 #8a5a16, 0 8px 16px rgba(30, 20, 8, 0.3);
  }
  #startBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a16; }
  .keysHint { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
</style>

<canvas id="game"></canvas>

<div class="hud wooden" aria-live="off">
  <div><span class="coin"></span> <b id="money">0</b> <span class="cap" id="rate"></span></div>
  <div><span class="cap">STORED</span> <span id="storage">0/6</span></div>
  <div id="eventRow"><span class="cap">EVENT</span> <span id="eventName">—</span></div>
</div>
<div id="banner"></div>

<div id="stick"><div id="knob"></div></div>
<button class="btn" id="hitBtn" aria-label="Attack">HIT</button>
<button class="btn" id="shopBtn" aria-label="Open shop">SHOP</button>

<div id="shop" role="dialog" aria-label="Shop">
  <div id="shopHead"><h2>TRADING POST</h2><button id="closeShop" aria-label="Close shop">✕</button></div>
  <div id="shopMoney"></div>
  <div id="shopList"></div>
</div>

<div id="intro">
  <div id="introCard">
    <h1>FABLE<br>COMPOUND</h1>
    <p>Steal brainrots from three rival camps, haul them home, and bank them before the keepers steal them back.</p>
    <button id="startBtn">PLAY</button>
    <p class="keysHint">touch: joystick + buttons · keys: WASD · F hit · B shop</p>
  </div>
</div>

<script>
"use strict";

// ---------- config ----------
const RARITY_COLORS = {
  Common: "#cfd6cf", Uncommon: "#7fc56b", Rare: "#5aa8e0",
  Epic: "#b07fe0", Legendary: "#e8a33d", Mythic: "#e06a9a",
};
const BRAINROTS = [
  { id: "ScreamingCube",      name: "Screaming Cube",      rarity: "Common",    cost: 20,  income: 3,  r: 11 },
  { id: "GlitchOrb",          name: "Glitch Orb",          rarity: "Rare",      cost: 80,  income: 9,  r: 12 },
  { id: "DancingNoobIdol",    name: "Dancing Noob Idol",   rarity: "Epic",      cost: 160, income: 16, r: 13 },
  { id: "CryingEmojiCore",    name: "Crying Emoji Core",   rarity: "Legendary", cost: 300, income: 28, r: 14 },
  { id: "UnstableBananaRelic",name: "Unstable Banana Relic",rarity: "Mythic",   cost: 640, income: 52, r: 15 },
];
const UPGRADES = [
  { id: "StorageSlots",  name: "Storage Slots",  desc: "raise camp capacity", tiers: [ { cost: 120, delta: 2 }, { cost: 240, delta: 2 }, { cost: 480, delta: 3 } ] },
  { id: "IncomeBoost",   name: "Income Boost",   desc: "multiply passive income", tiers: [ { cost: 160, mult: 1.15 }, { cost: 350, mult: 1.35 } ] },
  { id: "CarrySpeed",    name: "Carry Servos",   desc: "move faster while carrying", tiers: [ { cost: 200, mult: 0.82 }, { cost: 450, mult: 0.92 } ] },
];
const WORLD = 1500, BASE_R = 132, PAD_R = 30;
const PLAYER_SPEED = 205, CARRY_MULT = 0.72, STEAL_HOLD = 0.45;
const HIT_RANGE = 78, HIT_CD = 0.6, EVENT_GAP = 90;
const SAVE_KEY = "neonCompoundSave_v1";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- state ----------
const bases = [];
const items = [];
const bots = [];
const particles = [];
let player, camX = 0, camY = 0, shake = 0;
let money = 150, upgradeLv = { StorageSlots: 0, IncomeBoost: 0, CarrySpeed: 0 };
let activeEvent = null, eventTimer = EVENT_GAP * 0.6, running = false, last = 0;

const BASE_DEFS = [
  { name: "YOU",   color: "#4a78d0", isPlayer: true },
  { name: "RUSK",  color: "#d05348" },
  { name: "MOSS",  color: "#9a6ad0" },
  { name: "BRAN",  color: "#e0883a" },
];
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
  const x = WORLD / 2 + Math.cos(a) * 470, y = WORLD / 2 + Math.sin(a) * 470;
  const toC = Math.atan2(WORLD / 2 - y, WORLD / 2 - x);
  bases.push({ i, x, y, padX: x + Math.cos(toC) * (BASE_R - 34), padY: y + Math.sin(toC) * (BASE_R - 34),
    ...BASE_DEFS[i], slots: 6, stored: [] });
}

// ---------- scenery (seeded so the forest is stable) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260717);
function nearPath(x, y) {
  const d1 = Math.abs(x - y) / Math.SQRT2;
  const d2 = Math.abs(x + y - WORLD) / Math.SQRT2;
  return d1 < 95 || d2 < 95;
}
function nearBase(x, y, pad) {
  return bases.some(b => Math.hypot(b.x - x, b.y - y) < BASE_R + pad);
}
const pond = { x: WORLD * 0.16, y: WORLD * 0.5, rx: 90, ry: 62 };
const trees = [], rocks = [], patches = [];
for (let n = 0; n < 150 && trees.length < 95; n++) {
  const x = 50 + rng() * (WORLD - 100), y = 50 + rng() * (WORLD - 100);
  if (nearPath(x, y) || nearBase(x, y, 55)) continue;
  if (Math.hypot((x - pond.x) / pond.rx, (y - pond.y) / pond.ry) < 1.5) continue;
  trees.push({ x, y, s: 26 + rng() * 26 });
}
trees.sort((a, b) => a.y - b.y);
for (let n = 0; n < 14; n++) {
  const x = 60 + rng() * (WORLD - 120), y = 60 + rng() * (WORLD - 120);
  if (nearPath(x, y) || nearBase(x, y, 40)) continue;
  rocks.push({ x, y, s: 10 + rng() * 14, tone: rng() });
}
for (let n = 0; n < 40; n++) {
  patches.push({ x: rng() * WORLD, y: rng() * WORLD, r: 40 + rng() * 90 });
}

function spawnItem(defId, baseIdx) {
  const def = BRAINROTS.find(b => b.id === defId);
  const base = bases[baseIdx];
  const item = { def, owner: baseIdx, state: "stored", carrier: null, x: 0, y: 0, progress: 0 };
  base.stored.push(item); items.push(item);
  layoutBase(base);
  return item;
}
function layoutBase(base) {
  base.stored.forEach((it, n) => {
    const col = n % 3, row = Math.floor(n / 3);
    it.x = base.x - 34 + col * 34; it.y = base.y - 10 + row * 34;
  });
}

// ---------- persistence ----------
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      money, upgradeLv, owned: bases[0].stored.map(it => it.def.id),
    }));
  } catch (e) { /* private browsing: session-only progress */ }
}
function load() {
  let data = null;
  try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (data && typeof data.money === "number") {
    money = Math.max(0, Math.floor(data.money));
    for (const u of UPGRADES) {
      const lv = data.upgradeLv && data.upgradeLv[u.id];
      if (typeof lv === "number") upgradeLv[u.id] = Math.min(Math.max(0, lv), u.tiers.length);
    }
    const owned = Array.isArray(data.owned) && data.owned.length ? data.owned : ["ScreamingCube", "GlitchOrb"];
    owned.slice(0, 20).forEach(id => { if (BRAINROTS.some(b => b.id === id)) spawnItem(id, 0); });
  } else {
    spawnItem("ScreamingCube", 0); spawnItem("GlitchOrb", 0);
  }
  bases[0].slots = 6 + UPGRADES[0].tiers.slice(0, upgradeLv.StorageSlots).reduce((s, t) => s + t.delta, 0);
  spawnItem("ScreamingCube", 1); spawnItem("GlitchOrb", 1); spawnItem("DancingNoobIdol", 1);
  spawnItem("ScreamingCube", 2); spawnItem("GlitchOrb", 2); spawnItem("CryingEmojiCore", 2);
  spawnItem("GlitchOrb", 3); spawnItem("DancingNoobIdol", 3); spawnItem("UnstableBananaRelic", 3);
}

// ---------- audio ----------
let AC = null;
function beep(freq, dur, type, vol, slide) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime + dur);
  g.gain.value = vol || 0.04;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
}
const sfx = {
  steal: () => beep(340, 0.18, "triangle", 0.06, 700),
  deposit: () => { beep(523, 0.12, "triangle", 0.06); setTimeout(() => beep(784, 0.16, "triangle", 0.06), 90); },
  buy: () => beep(660, 0.09, "sine", 0.07),
  hit: () => beep(140, 0.14, "square", 0.05, 60),
  event: () => { [440, 554, 659].forEach((f, n) => setTimeout(() => beep(f, 0.14, "triangle", 0.05), n * 100)); },
  deny: () => beep(180, 0.12, "square", 0.035),
};

// ---------- alerts ----------
const bannerEl = document.getElementById("banner");
function alertMsg(text, cls) {
  const el = document.createElement("div");
  el.className = "alert" + (cls ? " " + cls : "");
  el.textContent = text;
  bannerEl.appendChild(el);
  while (bannerEl.children.length > 3) bannerEl.firstChild.remove();
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, 2600);
}

// ---------- entities ----------
player = { x: 0, y: 0, carrying: null, hitCd: 0, face: 0 };
player.x = bases[0].x; player.y = bases[0].y + BASE_R + 40;

for (let i = 1; i < 4; i++) {
  bots.push({ base: i, x: bases[i].x, y: bases[i].y, state: "home", timer: 3 + i * 4,
    target: null, carrying: null, stun: 0, speed: 150 + i * 8 });
}

function incomeMult() {
  const tier = upgradeLv.IncomeBoost;
  const personal = tier > 0 ? UPGRADES[1].tiers[tier - 1].mult : 1;
  return personal * (activeEvent && activeEvent.id === "double" ? 2 : 1);
}
function carryMult() {
  const tier = upgradeLv.CarrySpeed;
  return tier > 0 ? UPGRADES[2].tiers[tier - 1].mult : CARRY_MULT;
}
function stealHold() { return activeEvent && activeEvent.id === "vault" ? 0.06 : STEAL_HOLD; }

// ---------- events ----------
const EVENTS = [
  { id: "double", name: "DOUBLE INCOME", dur: 45 },
  { id: "vault",  name: "GATES OPEN", dur: 22 },
  { id: "chaos",  name: "CHAOS MINUTE", dur: 45 },
];
function tickEvents(dt) {
  eventTimer -= dt;
  if (activeEvent) {
    if (eventTimer <= 0) {
      alertMsg(activeEvent.name + " ended", "");
      activeEvent = null; eventTimer = EVENT_GAP;
    }
  } else if (eventTimer <= 0) {
    activeEvent = EVENTS[Math.floor(Math.random() * EVENTS.length)];
    eventTimer = activeEvent.dur;
    alertMsg(activeEvent.name, "event");
    sfx.event();
  }
}

// ---------- stealing / deposit ----------
function removeFromBase(item) {
  const base = bases[item.owner];
  if (base) { const k = base.stored.indexOf(item); if (k >= 0) base.stored.splice(k, 1); layoutBase(base); }
}
function tryPlayerSteal(dt) {
  if (player.carrying) return;
  let best = null, bestD = 46;
  for (const it of items) {
    if (it.state !== "stored" && it.state !== "ground") continue;
    if (it.state === "stored" && it.owner === 0) continue;
    const d = Math.hypot(it.x - player.x, it.y - player.y);
    if (d < bestD) { best = it; bestD = d; }
  }
  for (const it of items) if (it !== best && it.progress > 0) it.progress = 0;
  if (!best) return;
  best.progress += dt;
  if (best.progress >= stealHold()) {
    best.progress = 0;
    if (best.state === "stored") removeFromBase(best);
    best.state = "carried"; best.carrier = "player"; player.carrying = best;
    alertMsg("Stole " + best.def.name + "!", "good");
    sfx.steal();
    burst(best.x, best.y, RARITY_COLORS[best.def.rarity], 10);
  }
}
let fullAlertCd = 0;
function tryPlayerDeposit(dt) {
  fullAlertCd = Math.max(0, fullAlertCd - dt);
  const b = bases[0];
  if (!player.carrying) return;
  if (Math.hypot(player.x - b.padX, player.y - b.padY) > PAD_R + 14) return;
  if (b.stored.length >= b.slots) {
    if (fullAlertCd === 0) { alertMsg("Camp full — buy Storage Slots", ""); sfx.deny(); fullAlertCd = 3; }
    return;
  }
  const it = player.carrying;
  player.carrying = null; it.carrier = null; it.state = "stored"; it.owner = 0;
  b.stored.push(it); layoutBase(b);
  alertMsg("Banked " + it.def.name, "good");
  sfx.deposit(); burst(b.padX, b.padY, "#eeb64a", 16);
  save();
}
function playerHit() {
  if (player.hitCd > 0) return;
  player.hitCd = HIT_CD;
  shake = reduceMotion ? 0 : 6;
  sfx.hit();
  burst(player.x + Math.cos(player.face) * 40, player.y + Math.sin(player.face) * 40, "#f3e3c2", 8);
  for (const bot of bots) {
    if (Math.hypot(bot.x - player.x, bot.y - player.y) < HIT_RANGE) {
      bot.stun = 1.4;
      const a = Math.atan2(bot.y - player.y, bot.x - player.x);
      bot.x += Math.cos(a) * 46; bot.y += Math.sin(a) * 46;
      if (bot.carrying) {
        const it = bot.carrying;
        bot.carrying = null; it.carrier = null; it.state = "ground";
        it.x = bot.x; it.y = bot.y;
        alertMsg("Interrupted " + bases[bot.base].name + "!", "good");
      }
    }
  }
}

// ---------- bots ----------
function botThink(bot, dt) {
  const home = bases[bot.base];
  if (bot.stun > 0) { bot.stun -= dt; return; }
  const chaos = activeEvent && activeEvent.id === "chaos";
  const speed = bot.speed * (chaos ? 1.45 : 1) * (bot.carrying ? 0.8 : 1);

  if (bot.state === "home") {
    bot.timer -= dt * (chaos ? 2 : 1);
    if (bot.timer <= 0) {
      const pool = items.filter(it =>
        (it.state === "stored" && it.owner !== bot.base) || it.state === "ground");
      if (pool.length) {
        pool.sort((a, b) => (b.def.income + (b.owner === 0 ? 25 : 0)) - (a.def.income + (a.owner === 0 ? 25 : 0)));
        bot.target = pool[Math.floor(Math.random() * Math.min(3, pool.length))];
        bot.state = "raid";
      } else bot.timer = 4;
    }
    return;
  }
  if (bot.state === "raid") {
    const t = bot.target;
    if (!t || (t.state !== "stored" && t.state !== "ground")) { bot.state = "return"; return; }
    const d = Math.hypot(t.x - bot.x, t.y - bot.y);
    if (d < 20) {
      if (t.state === "stored") removeFromBase(t);
      if (t.owner === 0) alertMsg(bases[bot.base].name + " stole your " + t.def.name + "!", "");
      t.state = "carried"; t.carrier = bot; bot.carrying = t; bot.state = "return";
    } else {
      bot.x += ((t.x - bot.x) / d) * speed * dt;
      bot.y += ((t.y - bot.y) / d) * speed * dt;
    }
    return;
  }
  const d = Math.hypot(home.padX - bot.x, home.padY - bot.y);
  if (d < 24) {
    if (bot.carrying && home.stored.length < home.slots) {
      const it = bot.carrying;
      bot.carrying = null; it.carrier = null; it.state = "stored"; it.owner = bot.base;
      home.stored.push(it); layoutBase(home);
    } else if (bot.carrying) {
      const it = bot.carrying; bot.carrying = null; it.carrier = null;
      it.state = "ground"; it.x = bot.x + 30; it.y = bot.y;
    }
    bot.state = "home"; bot.timer = (chaos ? 3 : 7) + Math.random() * 8;
  } else {
    bot.x += ((home.padX - bot.x) / d) * speed * dt;
    bot.y += ((home.padY - bot.y) / d) * speed * dt;
  }
}

// ---------- income ----------
let incomeAcc = 0;
function tickIncome(dt) {
  incomeAcc += dt;
  if (incomeAcc < 1) return;
  incomeAcc -= 1;
  const gain = bases[0].stored.reduce((s, it) => s + it.def.income, 0);
  if (gain > 0) money += Math.round(gain * incomeMult());
}

// ---------- particles ----------
function burst(x, y, color, n) {
  if (reduceMotion) n = Math.min(n, 4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color });
  }
}

// ---------- input ----------
const keys = {};
addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "f") playerHit();
  if (e.key.toLowerCase() === "b") toggleShop();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

const stickEl = document.getElementById("stick"), knobEl = document.getElementById("knob");
let joyId = null, joyOx = 0, joyOy = 0, joyX = 0, joyY = 0;
const canvas = document.getElementById("game");
canvas.addEventListener("pointerdown", e => {
  if (joyId !== null) return;
  joyId = e.pointerId; joyOx = e.clientX; joyOy = e.clientY; joyX = joyY = 0;
  stickEl.style.display = "block";
  stickEl.style.left = (joyOx - 55) + "px"; stickEl.style.top = (joyOy - 55) + "px";
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== joyId) return;
  const dx = e.clientX - joyOx, dy = e.clientY - joyOy;
  const d = Math.hypot(dx, dy), max = 48;
  const k = d > max ? max / d : 1;
  joyX = (dx * k) / max; joyY = (dy * k) / max;
  knobEl.style.transform = `translate(calc(-50% + ${dx * k}px), calc(-50% + ${dy * k}px))`;
});
function joyEnd(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joyX = joyY = 0;
  stickEl.style.display = "none";
  knobEl.style.transform = "translate(-50%,-50%)";
}
canvas.addEventListener("pointerup", joyEnd);
canvas.addEventListener("pointercancel", joyEnd);

document.getElementById("hitBtn").addEventListener("pointerdown", e => { e.preventDefault(); playerHit(); });
document.getElementById("shopBtn").addEventListener("click", toggleShop);
document.getElementById("closeShop").addEventListener("click", toggleShop);

// ---------- shop ----------
const shopEl = document.getElementById("shop");
function toggleShop() {
  shopEl.classList.toggle("open");
  if (shopEl.classList.contains("open")) renderShop();
}
let shopRenderedMoney = -1;
function renderShop() {
  shopRenderedMoney = money;
  document.getElementById("shopMoney").innerHTML = "gold: <b>$" + money.toLocaleString() + "</b>";
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  const head1 = document.createElement("div");
  head1.className = "shopHeader"; head1.textContent = "BRAINROTS";
  list.appendChild(head1);
  for (const def of BRAINROTS) {
    const full = bases[0].stored.length >= bases[0].slots;
    list.appendChild(card(RARITY_COLORS[def.rarity], def.name,
      def.rarity + " · +$" + def.income + "/s",
      "$" + def.cost, money >= def.cost && !full, () => {
        if (bases[0].stored.length >= bases[0].slots) { alertMsg("Camp full", ""); sfx.deny(); return; }
        money -= def.cost; spawnItem(def.id, 0);
        sfx.buy(); save(); renderShop();
      }));
  }
  const head2 = document.createElement("div");
  head2.className = "shopHeader"; head2.textContent = "UPGRADES";
  list.appendChild(head2);
  for (const u of UPGRADES) {
    const lv = upgradeLv[u.id], next = u.tiers[lv];
    if (!next) {
      list.appendChild(card("#7fc56b", u.name + " · MAX", u.desc, "MAX", false, null, true));
    } else {
      list.appendChild(card("#b8a888", u.name + " · " + lv + "/" + u.tiers.length,
        u.desc, "$" + next.cost, money >= next.cost, () => {
          money -= next.cost; upgradeLv[u.id]++;
          if (u.id === "StorageSlots") bases[0].slots += next.delta;
          sfx.buy(); save(); renderShop();
        }));
    }
  }
}
function card(color, name, sub, price, canBuy, onBuy, maxed) {
  const el = document.createElement("div");
  el.className = "card";
  const sw = document.createElement("div");
  sw.className = "swatch"; sw.style.background = color;
  const info = document.createElement("div"); info.className = "info";
  const n = document.createElement("div"); n.className = "name"; n.textContent = name;
  const s = document.createElement("div"); s.className = "sub"; s.textContent = sub;
  info.append(n, s);
  const btn = document.createElement("button");
  btn.className = "buy" + (maxed ? " max" : ""); btn.textContent = price;
  btn.disabled = !canBuy;
  if (onBuy) btn.addEventListener("click", onBuy);
  el.append(sw, info, btn);
  return el;
}

// ---------- render ----------
const ctx = canvas.getContext("2d");
let vw = 0, vh = 0;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  vw = innerWidth; vh = innerHeight;
  canvas.width = vw * dpr; canvas.height = vh * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.max(0, ((n >> 16) & 255) * f)) | 0;
  const g = Math.min(255, Math.max(0, ((n >> 8) & 255) * f)) | 0;
  const b = Math.min(255, Math.max(0, (n & 255) * f)) | 0;
  return "rgb(" + r + "," + g + "," + b + ")";
}
function blobShadow(x, y, rx, ry) {
  ctx.fillStyle = "rgba(38, 58, 30, 0.28)";
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
}

function drawTree(tr) {
  const { x, y, s } = tr;
  blobShadow(x + s * 0.12, y + s * 0.3, s * 0.55, s * 0.22);
  const tones = ["#3f7a3a", "#4c8c44", "#5a9e50"];
  for (let i = 0; i < 3; i++) {
    const k = 1 - i * 0.27, yy = y - i * s * 0.34;
    ctx.fillStyle = tones[i];
    ctx.beginPath();
    ctx.moveTo(x, yy - s * 0.85 * k);
    ctx.lineTo(x + s * 0.6 * k, yy + s * 0.22 * k);
    ctx.lineTo(x - s * 0.6 * k, yy + s * 0.22 * k);
    ctx.closePath(); ctx.fill();
  }
}
function drawRock(rk) {
  blobShadow(rk.x + 2, rk.y + rk.s * 0.4, rk.s * 0.9, rk.s * 0.35);
  const base = rk.tone > 0.5 ? "#9aa08f" : "#8b9183";
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.moveTo(rk.x - rk.s, rk.y + rk.s * 0.4);
  ctx.lineTo(rk.x - rk.s * 0.5, rk.y - rk.s * 0.6);
  ctx.lineTo(rk.x + rk.s * 0.4, rk.y - rk.s * 0.8);
  ctx.lineTo(rk.x + rk.s, rk.y + rk.s * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(base, 1.14);
  ctx.beginPath();
  ctx.moveTo(rk.x - rk.s * 0.5, rk.y - rk.s * 0.6);
  ctx.lineTo(rk.x + rk.s * 0.4, rk.y - rk.s * 0.8);
  ctx.lineTo(rk.x + rk.s * 0.3, rk.y - rk.s * 0.15);
  ctx.closePath(); ctx.fill();
}

function drawItem(it, t) {
  const c = RARITY_COLORS[it.def.rarity];
  const bob = it.state === "stored" ? Math.sin(t * 2.4 + it.x) * 2.5 : 0;
  const r = it.def.r;
  blobShadow(it.x, it.y + r * 0.75, r * 0.85, r * 0.34);
  const y = it.y + bob;
  // two-tone critter body
  ctx.fillStyle = shade(c, 0.8);
  ctx.beginPath(); ctx.arc(it.x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(it.x, y - r * 0.16, r * 0.88, 0, 7); ctx.fill();
  // ears
  ctx.fillStyle = shade(c, 0.85);
  ctx.beginPath(); ctx.arc(it.x - r * 0.55, y - r * 0.75, r * 0.28, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(it.x + r * 0.55, y - r * 0.75, r * 0.28, 0, 7); ctx.fill();
  // eyes
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(it.x - r * 0.3, y - r * 0.18, r * 0.22, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(it.x + r * 0.3, y - r * 0.18, r * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = "#3a2a18";
  ctx.beginPath(); ctx.arc(it.x - r * 0.28, y - r * 0.15, r * 0.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(it.x + r * 0.32, y - r * 0.15, r * 0.1, 0, 7); ctx.fill();
  if (it.progress > 0) {
    ctx.beginPath();
    ctx.strokeStyle = "#eeb64a"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.arc(it.x, y, r + 10, -Math.PI / 2, -Math.PI / 2 + (it.progress / stealHold()) * Math.PI * 2);
    ctx.stroke();
  }
}

function drawRunner(x, y, color, carrying, stunned, t) {
  blobShadow(x, y + 15, 14, 6);
  // body (tunic)
  ctx.fillStyle = shade(color, 0.85);
  ctx.beginPath(); ctx.roundRect(x - 9, y - 1, 18, 17, 7); ctx.fill();
  // feet
  ctx.fillStyle = "#5a4632";
  ctx.beginPath(); ctx.arc(x - 5, y + 16, 3.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 5, y + 16, 3.4, 0, 7); ctx.fill();
  // big chibi head with team hood
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - 9, 12.5, 0, 7); ctx.fill();
  ctx.fillStyle = "#f2c99a";
  ctx.beginPath(); ctx.arc(x, y - 7, 8.5, 0, 7); ctx.fill();
  ctx.fillStyle = "#3a2a18";
  ctx.beginPath(); ctx.arc(x - 3, y - 8, 1.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 3, y - 8, 1.5, 0, 7); ctx.fill();
  if (stunned) {
    ctx.strokeStyle = "#eeb64a"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y - 6, 20 + Math.sin(t * 10) * 2, 0, 7); ctx.stroke();
  }
  if (carrying) { carrying.x = x; carrying.y = y - 32; }
}

function drawBankChest(b, t) {
  const pulse = Math.sin(t * 3) * 1.5;
  blobShadow(b.padX, b.padY + 11, 20, 8);
  ctx.strokeStyle = "rgba(74,47,26,0.5)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(b.padX, b.padY + 2, PAD_R + pulse, 0, 7); ctx.stroke();
  ctx.fillStyle = "#6b4527";
  ctx.beginPath(); ctx.roundRect(b.padX - 15, b.padY - 10, 30, 22, 5); ctx.fill();
  ctx.fillStyle = "#8a5f3a";
  ctx.beginPath(); ctx.roundRect(b.padX - 15, b.padY - 10, 30, 9, 5); ctx.fill();
  ctx.fillStyle = "#eeb64a";
  ctx.fillRect(b.padX - 2.5, b.padY - 6, 5, 12);
  ctx.font = "800 10px " + "ui-rounded, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#f3e3c2";
  ctx.strokeStyle = "rgba(58,42,24,0.85)"; ctx.lineWidth = 3; ctx.lineJoin = "round";
  ctx.strokeText("BANK", b.padX, b.padY + 24);
  ctx.fillText("BANK", b.padX, b.padY + 24);
}

function outlinedText(text, x, y, fill, px, weight) {
  ctx.font = (weight || 900) + " " + px + "px ui-rounded, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(58, 42, 24, 0.9)";
  ctx.lineWidth = px * 0.28; ctx.lineJoin = "round";
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(text, x, y);
}

function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (!running) dt = 0;

  if (running) {
    let mx = joyX, my = joyY;
    if (keys.w || keys.arrowup) my -= 1;
    if (keys.s || keys.arrowdown) my += 1;
    if (keys.a || keys.arrowleft) mx -= 1;
    if (keys.d || keys.arrowright) mx += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    const sp = PLAYER_SPEED * (player.carrying ? carryMult() : 1);
    player.x += mx * sp * dt; player.y += my * sp * dt;
    player.x = Math.max(30, Math.min(WORLD - 30, player.x));
    player.y = Math.max(30, Math.min(WORLD - 30, player.y));
    if (ml > 0.1) player.face = Math.atan2(my, mx);
    player.hitCd = Math.max(0, player.hitCd - dt);
    if (player.carrying) { player.carrying.x = player.x; player.carrying.y = player.y - 32; }

    tryPlayerSteal(dt);
    tryPlayerDeposit(dt);
    for (const bot of bots) botThink(bot, dt);
    tickIncome(dt);
    tickEvents(dt);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 24);
  }

  camX += (player.x - camX) * 0.08; camY += (player.y - camY) * 0.08;

  // ---- draw ----
  ctx.fillStyle = "#2f5c2d";
  ctx.fillRect(0, 0, vw, vh);
  ctx.save();
  const sx = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(vw / 2 - camX + sx, vh / 2 - camY + sx);

  // meadow
  ctx.fillStyle = "#79b25f";
  ctx.fillRect(0, 0, WORLD, WORLD);
  ctx.fillStyle = "rgba(90, 140, 70, 0.35)";
  for (const p of patches) {
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * 0.7, 0, 0, 7); ctx.fill();
  }

  // dirt paths (two diagonals, like a crossroads through the woods)
  ctx.strokeStyle = "#b08a5e";
  ctx.lineWidth = 120; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(70, 70); ctx.lineTo(WORLD - 70, WORLD - 70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(WORLD - 70, 70); ctx.lineTo(70, WORLD - 70); ctx.stroke();
  ctx.strokeStyle = "rgba(140, 104, 66, 0.5)";
  ctx.lineWidth = 100;
  ctx.beginPath(); ctx.moveTo(85, 85); ctx.lineTo(WORLD - 85, WORLD - 85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(WORLD - 85, 85); ctx.lineTo(85, WORLD - 85); ctx.stroke();

  // pond
  ctx.fillStyle = "#4a7cc0";
  ctx.beginPath(); ctx.ellipse(pond.x, pond.y, pond.rx, pond.ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#5b8fd6";
  ctx.beginPath(); ctx.ellipse(pond.x, pond.y - 4, pond.rx * 0.88, pond.ry * 0.82, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath(); ctx.ellipse(pond.x - 18, pond.y - 14, 22, 8, -0.4, 0, 7); ctx.fill();

  // world edge hedge
  ctx.strokeStyle = "#3c7239"; ctx.lineWidth = 26;
  ctx.strokeRect(0, 0, WORLD, WORLD);

  // rocks
  for (const rk of rocks) drawRock(rk);

  // camp clearings
  for (const b of bases) {
    ctx.fillStyle = "#b08a5e";
    ctx.beginPath(); ctx.arc(b.x, b.y, BASE_R, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(140, 104, 66, 0.4)";
    ctx.beginPath(); ctx.arc(b.x, b.y + 8, BASE_R * 0.82, 0, 7); ctx.fill();
    // wooden fence posts
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 14) {
      const px = b.x + Math.cos(a) * BASE_R, py = b.y + Math.sin(a) * BASE_R;
      ctx.fillStyle = "#5d3f26";
      ctx.beginPath(); ctx.roundRect(px - 3.5, py - 9, 7, 15, 3); ctx.fill();
      ctx.fillStyle = "#7a5433";
      ctx.beginPath(); ctx.roundRect(px - 3.5, py - 9, 7, 6, 3); ctx.fill();
    }
    drawBankChest(b, t);
    outlinedText(b.name + " · " + b.stored.length + "/" + b.slots, b.x, b.y - BASE_R - 16, b.color, 17);
  }

  for (const it of items) drawItem(it, t);
  for (const bot of bots) drawRunner(bot.x, bot.y, bases[bot.base].color, bot.carrying, bot.stun > 0, t);
  drawRunner(player.x, player.y, "#4a78d0", player.carrying, false, t);
  if (player.hitCd > HIT_CD - 0.12) {
    ctx.strokeStyle = "rgba(243, 227, 194, 0.85)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(player.x, player.y, HIT_RANGE * (1 - (player.hitCd - (HIT_CD - 0.12)) / 0.12), 0, 7);
    ctx.stroke();
  }

  // trees on top so the forest reads as canopy
  for (const tr of trees) drawTree(tr);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // soft vignette
  const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.42, vw / 2, vh / 2, Math.max(vw, vh) * 0.72);
  vg.addColorStop(0, "rgba(30, 45, 20, 0)");
  vg.addColorStop(1, "rgba(30, 45, 20, 0.26)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, vw, vh);

  // HUD refresh
  if (shopEl.classList.contains("open") && shopRenderedMoney !== money) renderShop();
  document.getElementById("money").textContent = money.toLocaleString();
  const rate = Math.round(bases[0].stored.reduce((s, it) => s + it.def.income, 0) * incomeMult());
  document.getElementById("rate").textContent = rate ? "+" + rate + "/s" : "";
  document.getElementById("storage").textContent = bases[0].stored.length + "/" + bases[0].slots;
  const evRow = document.getElementById("eventRow");
  if (activeEvent) {
    evRow.classList.add("live");
    document.getElementById("eventName").textContent = activeEvent.name + " " + Math.ceil(eventTimer) + "s";
  } else {
    evRow.classList.remove("live");
    document.getElementById("eventName").textContent = "in " + Math.ceil(eventTimer) + "s";
  }
}

document.getElementById("startBtn").addEventListener("click", () => {
  document.getElementById("intro").remove();
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  running = true;
});
addEventListener("visibilitychange", () => { if (document.hidden) save(); });

load();
requestAnimationFrame(frame);
</script>
